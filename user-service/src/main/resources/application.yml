spring:
  application:
    name: user-service
  profiles:
    active: dev
  config:
    # SCA 2025.x 不再支持 bootstrap.yml，必须用 config.import 方式导入 Nacos 配置
    import:
      - nacos:user-service-dev.yml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yml
      discovery:
        # 配置Nacos注册中心地址
        server-addr: localhost:8848
